name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: AutoClicker-Windows.exe
            artifact_path: dist/AutoClicker-Windows.exe
          - os: macos-latest
            asset_name: AutoClicker-macOS.zip
            artifact_path: dist/AutoClicker-macOS.zip
          - os: ubuntu-latest
            asset_name: AutoClicker-Linux
            artifact_path: dist/AutoClicker-Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pynput on Linux links against Xlib at import time, and Tk needs the
      # system Tcl/Tk libs to bundle correctly. Install both before PyInstaller
      # walks the dependency graph.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-dev libxtst-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pyinstaller --onefile --windowed --name AutoClicker --icon icon.ico autoclicker.py
          elif [ "${{ runner.os }}" = "macOS" ]; then
            pyinstaller --onefile --windowed --name AutoClicker --icon icon.icns autoclicker.py
          else
            pyinstaller --onefile --windowed --name AutoClicker autoclicker.py
          fi

      # macOS --windowed builds a .app bundle next to the unix binary. Zip the
      # .app so it survives upload + download (Finder unpacks the zip cleanly
      # and preserves the bundle structure / executable bit).
      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          cd dist
          rm -f AutoClicker
          zip -r AutoClicker-macOS.zip AutoClicker.app

      # Rename Win/Linux outputs so the release page shows obvious,
      # OS-tagged filenames (matches the macOS zip naming).
      - name: Rename Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/AutoClicker.exe dist/AutoClicker-Windows.exe

      - name: Rename Linux artifact
        if: runner.os == 'Linux'
        run: mv dist/AutoClicker dist/AutoClicker-Linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_path }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          fail_on_unmatched_files: true
